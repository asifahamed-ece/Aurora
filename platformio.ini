; ============================================================================
;  Aurora -- Birthday Gift Firmware
;  Unified PlatformIO project for the ESP32-C3 birthday gift.
;
;  Single firmware image combining:
;    Block 1: OLED status screen + LED breathing chaser + 4 buttons + battery
;    Block 4: WiFi softAP + AsyncWebServer + WebSocket + LittleFS dashboard
;
;  The OLED shows the local status screen; the WiFi AP serves the dashboard
;  to connected browsers. LittleFS serves all dashboard assets.
;
;  Flash procedure:
;    1. pio run -t upload          -- build + flash firmware to ESP32-C3
;    2. pio run -t uploadfs        -- flash LittleFS image (dashboard files)
;
; ============================================================================

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -DAURORA_BOARD=\"ESP32-C3\"
    -DAURORA_BUILD_BLOCK=\"Aurora-Unified\"
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192

; All sources live under src/ (no block1/block4 subdirs)
; Compile everything: main.cpp + block4 helpers (wifi_ap, web_server, clock, etc.)
build_src_filter = +<*>

; Block 1 hardware: OLED + LED
; Block 4: WiFi + AsyncWebServer + dashboard
; Use the locally-patched ESPAsyncWebServer (in ./lib/) that pre-allocates
; the request's _temp String to avoid heap corruption on ESP32-C3 RISC-V.
; The upstream esphome/AsyncTCP-esphome is still required.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    esphome/AsyncTCP-esphome@^2.1.0
    bblanchon/ArduinoJson@^6.21.0
    ESPAsyncWebServer-aurora

upload_protocol = esptool
upload_port = /dev/ttyACM0

board_build.partitions = partitions_aurora.csv
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; LittleFS image -- built from data/ at the project root
board_build.filesystem = littlefs
